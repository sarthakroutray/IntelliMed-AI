<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IntelliMed AI</title>

    <!-- Google Fonts: IBM Plex family — Sans (UI), Serif (display), Mono (data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: 'rgb(var(--color-primary) / <alpha-value>)',
              "primary-strong": 'rgb(var(--color-primary-strong) / <alpha-value>)',
              brand: 'rgb(var(--color-brand) / <alpha-value>)',
              "brand-2": 'rgb(var(--color-brand-2) / <alpha-value>)',
              "brand-ink": 'rgb(var(--color-brand-ink) / <alpha-value>)',
              canvas: 'rgb(var(--color-canvas) / <alpha-value>)',
              surface: 'rgb(var(--color-surface) / <alpha-value>)',
              "surface-2": 'rgb(var(--color-surface-2) / <alpha-value>)',
              ink: 'rgb(var(--color-ink) / <alpha-value>)',
              body: 'rgb(var(--color-body) / <alpha-value>)',
              muted: 'rgb(var(--color-muted) / <alpha-value>)',
              subtle: 'rgb(var(--color-subtle) / <alpha-value>)',
              line: 'rgb(var(--color-line) / <alpha-value>)',
              success: 'rgb(var(--color-success) / <alpha-value>)',
              warning: 'rgb(var(--color-warning) / <alpha-value>)',
              danger: 'rgb(var(--color-danger) / <alpha-value>)',
              info: 'rgb(var(--color-info) / <alpha-value>)',
            },
            fontFamily: {
              sans: ['"IBM Plex Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              serif: ['"IBM Plex Serif"', 'ui-serif', 'Georgia', 'serif'],
              mono: ['"IBM Plex Mono"', 'ui-monospace', 'Menlo', 'monospace'],
              display: ['"IBM Plex Serif"', 'ui-serif', 'Georgia', 'serif'],
            },
            borderRadius: {
              sm: '3px',
              DEFAULT: '5px',
              lg: '7px',
              xl: '10px',
              '2xl': '14px',
              full: '9999px',
            },
            boxShadow: {
              card: '0 1px 2px rgb(24 32 28 / 0.06)',
              pop: '0 20px 48px -12px rgb(24 32 28 / 0.28)',
              glow: '0 0 0 3px rgb(var(--color-primary) / 0.15)',
            },
          },
        },
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
