<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IntelliMed AI</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: 'rgb(var(--color-primary) / <alpha-value>)',
              "primary-strong": 'rgb(var(--color-primary-strong) / <alpha-value>)',
              canvas: 'rgb(var(--color-canvas) / <alpha-value>)',
              surface: 'rgb(var(--color-surface) / <alpha-value>)',
              "surface-2": 'rgb(var(--color-surface-2) / <alpha-value>)',
              ink: 'rgb(var(--color-ink) / <alpha-value>)',
              body: 'rgb(var(--color-body) / <alpha-value>)',
              muted: 'rgb(var(--color-muted) / <alpha-value>)',
              subtle: 'rgb(var(--color-subtle) / <alpha-value>)',
              line: 'rgb(var(--color-line) / <alpha-value>)',
              success: 'rgb(var(--color-success) / <alpha-value>)',
              warning: 'rgb(var(--color-warning) / <alpha-value>)',
              danger: 'rgb(var(--color-danger) / <alpha-value>)',
              info: 'rgb(var(--color-info) / <alpha-value>)',
            },
            fontFamily: {
              sans: ["Manrope", "ui-sans-serif", "system-ui", "sans-serif"],
              display: ["Manrope", "ui-sans-serif", "system-ui", "sans-serif"],
            },
            borderRadius: {
              "sm": "0.375rem",
              "DEFAULT": "0.5rem",
              "lg": "0.625rem",
              "xl": "0.875rem",
              "2xl": "1.125rem",
              "full": "9999px",
            },
            boxShadow: {
              "card": "0 1px 2px rgb(15 23 42 / 0.05), 0 10px 30px -14px rgb(15 23 42 / 0.12)",
              "pop": "0 24px 60px -12px rgb(15 23 42 / 0.25)",
              "glow": "0 0 0 3px rgb(var(--color-primary) / 0.15)",
            },
          },
        },
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
